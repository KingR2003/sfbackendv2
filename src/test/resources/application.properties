# H2 Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=123
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT
jwt.secret=testSecretKeyForJWTTokenGenerationAndValidationPurposeOnly
jwt.expiration=3600000

# Mock AWS S3 Configuration
aws.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.region=ap-south-1
aws.s3.bucket-name=mock-bucket

# Mock AWS SNS Configuration
aws.sns.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.sns.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.sns.region=ap-south-1