# H2 Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT
jwt.secret=testSecretKeyForJWTTokenGenerationAndValidationPurposeOnly
jwt.expiration=3600000

# Mock AWS S3 Configuration
aws.s3.access-key-id=mock
aws.s3.secret-access-key=mock
aws.s3.region=us-east-1
aws.s3.bucket-name=mock-bucket

# Mock AWS SNS Configuration
aws.sns.access-key-id=mock
aws.sns.secret-access-key=mock
aws.sns.region=us-east-1